# Reads variables from ./.env (see .env.example). Run: docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-yahoo}
      NEWS_COUNT: ${NEWS_COUNT:-8}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      CORS_ORIGINS: '["http://localhost:3000"]'

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # the browser (not the container) calls the API, hence localhost
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

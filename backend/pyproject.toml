[project]
name = "stock-news-backend"
version = "0.1.0"
description = "FastAPI backend for stock news feeds"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai>=1.12.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "httpx>=0.27",
]
